name: Collect outage data

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may run this late or skip runs; data tolerates gaps
  workflow_dispatch: {}       # lets you press "Run workflow" manually

permissions:
  contents: write

# Never run two collections at once (they would both push to the data branch)
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4

      - name: Check out data branch into ./data (create it if missing)
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git clone --depth 1 --branch data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          else
            mkdir data && git -C data init -b data
            git -C data remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install requests

      - name: Poll sources
        id: poll
        run: python -m collector.run --data-dir data
        continue-on-error: true   # still save data, then fail the job below

      - name: Commit and push to data branch
        run: |
          cd data
          git config user.name "outage-collector"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push origin HEAD:data

      - name: Fail loudly if a source has failed 3 runs in a row
        if: steps.poll.outcome == 'failure'
        run: exit 1
